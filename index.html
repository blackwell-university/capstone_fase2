<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Formulario - Blackwell University</title>
    <link rel="icon" type="image/png" href="https://cdn.bitrix24.es/b15495391/landing/e79/e79fb239ff37e96e3340ef1ed8782f6c/Logotipo-Blackwell_1x.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Source Serif Pro', serif;
            background-image: url('https://campus.blackwell.university/pluginfile.php/1/theme_alpha/loginbg/1731598420/portada-campus-virtual.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
        }

        .floating-form {
            background-color: rgba(255, 255, 255, 0.95); /* Fondo semi-transparente */
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .floating-form img {
            max-width: 150px;
            margin-bottom: 1.5rem;
        }

        .floating-form h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .floating-form p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .btn-open-form {
            background-color: #007bff;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-open-form:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 576px) {
            .floating-form {
                padding: 2rem;
            }

            .btn-open-form {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-form">
        <img src="https://campus.blackwell.university/pluginfile.php/1/theme_alpha/customlogindmlogo/1731598420/logo-campus-virtual.png" alt="Logo de Blackwell University">
        <h2>Formulario de Registro</h2>
        <p>Haga clic en el botón para abrir el formulario Project Capstone fase 2.</p>
        <button onclick="window.open('https://forms.gle/ffzaatWyZpRQtwcM7', '_blank')" class="btn-open-form">
            Abrir Formulario
        </button>
    </div>
</body>
</html>
